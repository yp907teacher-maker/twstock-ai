name: 每日更新台股資料與網站

on:
  schedule:
    # UTC 時間；台北時間 = UTC+8
    - cron: "40 9 * * 1-5"    # 平日 17:40：收盤資料
    - cron: "10 */3 * * *"    # 每 3 小時：分段回填歷史資料（完成後只做輕量更新）
  workflow_dispatch:
    inputs:
      max_requests:
        description: "本次 FinMind 最多請求數"
        default: "2000"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: twstock-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DEMO_MODE: "false"
      ENABLE_SCHEDULER: "false"
      AUTO_BOOTSTRAP: "false"
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      BACKFILL_START: "2019-01-01"
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 資料庫存在 Actions 快取（不公開）；每次存一份新的，下次還原最新一份
      - name: 還原資料庫
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: twstock-db-${{ github.run_id }}
          restore-keys: twstock-db-

      - name: 安裝套件
        run: pip install -r backend/requirements.txt

      - name: 抓資料、回填、計算
        working-directory: backend
        run: |
          MAX=${{ github.event.inputs.max_requests || '' }}
          if [ -z "$MAX" ]; then
            if [ -n "$FINMIND_TOKEN" ]; then MAX=2000; else MAX=900; fi
          fi
          python -m app.cli ci --max-requests "$MAX"

      - name: 儲存資料庫
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data
          key: twstock-db-${{ github.run_id }}

      - name: 建置網站
        run: |
          cd frontend
          npm ci
          VITE_STATIC=1 npx vite build --mode static
          cd ../backend
          python dump_static.py ../frontend/dist-static/data --price-days 750

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-static

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
